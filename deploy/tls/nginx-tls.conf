# 瓯医数链 TLS 终结反代配置模板（P0-1.2 等保三级·传输加密 TLS 1.3）
#
# 用法：
#   1. 将证书/私钥放置到 /etc/nginx/ssl/（或修改下方路径）；
#   2. 复制本文件到 /etc/nginx/conf.d/oumed-chain.conf，nginx -t && nginx -s reload；
#   3. 80 端口仅做 HTTPS 跳转；后端 uvicorn 监听 127.0.0.1:8000（不对外暴露）。
#
# 验证：
#   openssl s_client -connect <域名>:443 -tls1_3   # 应握手成功
#   openssl s_client -connect <域名>:443 -tls1_1   # 应被拒绝
#   curl -sI https://<域名>/api/health | grep -i strict-transport-security

server {
    listen 80;
    server_name yimao.example.cn;          # TODO: 替换为实际域名
    return 301 https://$host$request_uri;   # 全量 HTTPS 跳转
}

server {
    listen 443 ssl;
    http2 on;
    server_name yimao.example.cn;          # TODO: 替换为实际域名

    # ---- 证书 ----
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ---- 等保三级：仅 TLS 1.3（如需兼容老客户端可追加 TLSv1.2，需评估测评口径）----
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- 安全响应头（应用层中间件已下发 HSTS；反代兜底防止后端直连绕过）----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ---- 反代到后端 uvicorn ----
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # LLM 长对话请求（p50 约 15s）
        client_max_body_size 20m;  # 影像/档案上传
    }
}
