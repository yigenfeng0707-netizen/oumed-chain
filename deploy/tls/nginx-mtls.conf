# 瓯医数链 mTLS 双向认证反代模板（P1.2 节点认证与传输安全）
#
# 与 nginx-tls.conf 的区别：在 TLS 1.3 传输加密之上，对"节点面"端点强制校验
# 医院节点客户端证书（ssl_verify_client）——中间人即使拿到服务器公网地址，
# 没有联邦 CA 签发的客户端证书也无法完成 TLS 握手（验收：模拟攻击被拒绝）。
#
# 节点面端点（仅这些路径要求客户端证书；管理面走浏览器无需证书）：
#   GET  /api/federation/nodes/my-jobs
#   GET  /api/federation/nodes/jobs/{id}/assignment
#   POST /api/federation/nodes/jobs/{id}/moments
#   POST /api/federation/nodes/jobs/{id}/rounds/{n}/update
#
# 用法：
#   1. bash gen-certs.sh <域名> <节点数> 签发 CA/服务端/客户端证书 → certs/；
#   2. 将本文件复制到 /etc/nginx/conf.d/oumed-chain-mtls.conf（注意与
#      nginx-tls.conf 二选一，避免 443 端口重复监听）；
#   3. nginx -t && nginx -s reload；
#   4. 节点 Agent 配置：COORDINATOR_URL=https://<域名>、TLS_CA_CERT=certs/ca.crt、
#      TLS_CLIENT_CERT=certs/client-node1.crt、TLS_CLIENT_KEY=certs/client-node1.key。
#
# 中间人攻击模拟验证（验收步骤，详见 docs/联邦节点部署与演练方案.md）：
#   ① 无证书访问节点面：curl --cacert certs/ca.crt https://<域名>/api/federation/nodes/my-jobs
#      → 400（TLS 握手被要求客户端证书，无证书即失败，curl 报 certificate required）
#   ② 用非联邦 CA 签发的客户端证书访问 → 400（握手被拒，unknown ca）
#   ③ 用联邦 CA 签发的客户端证书访问 → 401（握手成功，进入应用层节点凭证校验）
#      ——握手成功但凭证错误 = mTLS 与机器凭证两层防线各自生效。

server {
    listen 80;
    server_name yimao.example.cn;          # TODO: 替换为实际域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name yimao.example.cn;          # TODO: 替换为实际域名

    # ---- 服务端证书 ----
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ---- mTLS 客户端证书校验 ----
    # optional = TLS 层请求客户端证书但不强制，节点面 location 内强制校验；
    # （管理面/患者端无证书仍可访问，避免一刀切影响浏览器用户）
    ssl_client_certificate /etc/nginx/ssl/ca.crt;    # gen-certs.sh 签发的联邦 CA
    ssl_verify_client optional;
    ssl_verify_depth 2;

    # ---- 等保三级：仅 TLS 1.3 ----
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ---- 节点面：强制客户端证书（握手层拒绝，请求根本到不了应用）----
    location ~ ^/api/federation/nodes/(my-jobs|jobs/[^/]+/(assignment|moments|rounds/[^/]+/update))$ {
        if ($ssl_client_verify != SUCCESS) {
            return 403;   # 无证书/非联邦CA签发/已吊销 → 一律拒绝
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 客户端证书指纹透传应用层（预留：注册节点时可登记指纹做应用层二次绑定）
        proxy_set_header X-Node-Cert-Fingerprint $ssl_client_fingerprint;
    }

    # ---- 其余路径（管理面/业务面）：正常反代，无需客户端证书 ----
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # LLM 长对话请求（p50 约 15s）
        client_max_body_size 20m;  # 影像/档案上传
    }
}
