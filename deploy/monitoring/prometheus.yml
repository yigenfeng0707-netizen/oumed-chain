# 瓯医数链 Prometheus 配置（docker compose --profile monitoring 启用）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alert-rules.yml

scrape_configs:
  - job_name: oumed-trust-backend
    metrics_path: /metrics
    static_configs:
      # dev profile 用 backend；prod profile 改为 backend-prod
      - targets: ["backend:8000"]
        labels:
          env: dev
