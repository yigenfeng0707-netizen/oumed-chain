[tool.ruff]
# Ruff 配置：现代化 Python linter + formatter
# 文档：https://docs.astral.sh/ruff/configuration/
# 注意：必须是 [tool.ruff] 而非 [toolset.ruff]，否则配置不生效

# 目标 Python 版本
target-version = "py311"

# 行宽
line-length = 120

# 排除的目录
extend-exclude = [
    "chroma_data",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# 启用的规则集
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
]

# 忽略的规则
ignore = [
    "E501",   # 行过长（由 formatter 处理）
    "B008",   # 函数默认参数中使用函数调用（FastAPI Depends 常用）
    "SIM117", # 嵌套 with（可读性）
]

# 自动修复
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "E741", "B007", "B905"]  # 测试中允许短变量名/未用循环变量/省略 zip strict
"scripts/*" = ["N999"]         # 脚本文件名不强制模块化

[tool.ruff.lint.isort]
known-first-party = ["app"]

[toolset.ruff.format]
# 格式化配置
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
