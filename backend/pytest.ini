[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=63

# 覆盖率口径说明：单元测试覆盖四大算法引擎 + EEG/影像引擎 + 设备适配层，
# 另含 orchestrator 离线链路（意图识别/多意图路由/降级兜底）与
# agents/eeg 路由层离线测试（内存 SQLite + dependency_overrides）。
# routers/main/crud 其余接入层由 scripts/smoke_test.py 端到端冒烟覆盖（68 项）。
# 门槛 63% 防回退（当前实测 65.03%）。

[coverage:run]
source = app
omit =
    app/__pycache__/*
    app/services/llm_service.py
    app/services/ocr_service.py
    app/services/knowledge_base.py
    */tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
show_missing = true
precision = 2
