<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>10人数据整合总览 · 嘀嗒医</title>
<style>
:root{--ink:#16364c;--muted:#6e8495;--line:#d9e8f0;--blue:#187bc8;--cyan:#0aa6bd;--green:#16886b}*{box-sizing:border-box}body{margin:0;background:#f1f7fa;color:var(--ink);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}header{display:flex;align-items:center;gap:12px;padding:16px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}header b{font-size:19px;margin-right:auto}a.btn{padding:9px 14px;border:1px solid #c9dae4;border-radius:9px;color:var(--ink);background:#fff;text-decoration:none}.primary{background:linear-gradient(135deg,var(--cyan),var(--blue))!important;color:#fff!important;border:0!important}main{width:min(1500px,calc(100% - 36px));margin:24px auto 50px}.notice{padding:13px 16px;border:1px solid #bde5dd;background:#effaf7;color:#216d5b;border-radius:12px}.metrics{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin:18px 0}.metric,.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 25px rgba(43,91,119,.06)}.metric{padding:16px}.metric b{display:block;color:var(--blue);font-size:24px}.metric span{color:var(--muted);font-size:12px}.pipeline{display:flex;align-items:center;gap:8px;padding:18px;overflow:auto}.step{min-width:150px;padding:13px;border-radius:11px;background:#f4f9fc;border:1px solid var(--line)}.step b{display:block;color:var(--blue)}.arrow{font-size:21px;color:var(--cyan)}.head{display:flex;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--line)}.head h2{margin:0;font-size:16px}.head span{color:var(--muted)}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px 13px;border-bottom:1px solid #e7eff4;text-align:left;white-space:nowrap}th{background:#f7fafc;color:#637d91}td.wrap{white-space:normal;min-width:180px}.ok{display:inline-block;padding:3px 8px;border-radius:999px;background:#e9f8f3;color:var(--green);font-size:12px}.link{color:var(--blue);text-decoration:none;margin-right:10px}.loading{padding:40px;text-align:center;color:var(--muted)}@media(max-width:1000px){.metrics{grid-template-columns:repeat(2,1fr)}header{flex-wrap:wrap}main{width:calc(100% - 20px)}}
</style>
</head>
<body>
<header><b>嘀嗒医 · 10人数据整合总览</b><a class="btn" href="./">数字人体</a><a class="btn" href="dossier.html">单人全量档案</a><a class="btn" href="/api/body-archive/ai-table?format=csv" download>AI总表</a><a class="btn primary" href="/api/body-archive/archive/all.zip" download>下载10人ZIP</a></header>
<main>
<div class="notice">正式测试名单与主系统 <b>oumed-chain</b> 的 `user_001—user_010` 一一对应。患者数据为合成测试数据；公开 CT/PET/SVG 仅作为独立教学素材，不会混入患者原片。</div>
<div class="metrics" id="metrics"></div>
<section class="card"><div class="head"><h2>数据整合链路</h2><span>所有患者执行相同流程</span></div><div class="pipeline"><div class="step"><b>① 主系统人数</b>10个稳定用户ID</div><span class="arrow">→</span><div class="step"><b>② 一人一档</b>人口学与医保</div><span class="arrow">→</span><div class="step"><b>③ 3D病史</b>器官与时间线</div><span class="arrow">→</span><div class="step"><b>④ 多模态</b>检验、EEG、原件</div><span class="arrow">→</span><div class="step"><b>⑤ AI归整</b>来源可追溯长表</div><span class="arrow">→</span><div class="step"><b>⑥ 输出</b>CSV/JSON/ZIP</div></div></section>
<section class="card" style="margin-top:18px"><div class="head"><h2>10位用户数据覆盖矩阵</h2><span id="updated">正在加载…</span></div><div class="table" id="table"><div class="loading">正在按用户ID归集数据…</div></div></section>
</main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(url);return r.json()}
async function main(){try{const idx=await get('/api/body-archive/patients');const ds=await Promise.all(idx.patients.map(p=>get(`/api/body-archive/patients/${encodeURIComponent(p.id)}/dossier`)));const sum=k=>ds.reduce((n,d)=>n+(k(d)||0),0);const metrics=[[ds.length,'正式测试用户'],[sum(d=>d.records.length),'3D病史'],[sum(d=>d.lab_results.length),'检验结果'],[sum(d=>d.eeg_sessions.length),'EEG会话'],[sum(d=>d.materials.filter(x=>x.stored_name).length),'原始文件'],[sum(d=>d.ai_organized_table.length),'AI统表行'],[sum(d=>d.completeness.ready_for_mock_export?1:0),'可导出档案']];document.querySelector('#metrics').innerHTML=metrics.map(x=>`<div class="metric"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('');document.querySelector('#updated').textContent=`${ds.length}人已归集 · ${new Date().toLocaleTimeString('zh-CN',{hour12:false})}`;document.querySelector('#table').innerHTML=`<table><thead><tr><th>ID / 档案号</th><th>用户</th><th>城市 / 参保</th><th>主系统疾病标签</th><th>3D病史</th><th>检验</th><th>EEG</th><th>文件</th><th>AI行</th><th>链路</th><th>打开</th></tr></thead><tbody>${ds.map(d=>{const p=d.profile||{},c=d.integration_coverage||{};return `<tr><td>${esc(d.patient_id)}<br><small>${esc(d.archive_id)}</small></td><td>${esc(d.name)} · ${esc(d.age)}岁 · ${d.sex==='m'?'男':'女'}</td><td>${esc(p.city)}<br><small>${esc(p.insurance_type)}</small></td><td class="wrap">${esc((p.system_conditions||[]).join('、')||'无既有疾病标签')}</td><td>${d.records.length}</td><td>${d.lab_results.length}</td><td>${d.eeg_sessions.length}</td><td>${d.materials.filter(x=>x.stored_name).length}</td><td>${d.ai_organized_table.length}</td><td><span class="ok">${Object.values(c).every(Boolean)?'全链路':'待补齐'}</span></td><td><a class="link" href="./?patient=${encodeURIComponent(d.patient_id)}">3D</a><a class="link" href="dossier.html?patient=${encodeURIComponent(d.patient_id)}">档案</a></td></tr>`}).join('')}</tbody></table>`}catch(e){document.querySelector('#table').innerHTML='<div class="loading">加载失败，请确认本地服务已启动。</div>'}}
main();
</script>
</body></html>
