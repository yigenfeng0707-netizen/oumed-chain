# nginx 反向代理配置（生产环境用）
# 用法：nginx -c /path/to/nginx.conf
# 前提：前端构建产物在 /var/www/yibao-zhinao，后端 uvicorn 跑在 8000 端口

upstream yibao_backend {
    server 127.0.0.1:8000;
    # 水平扩展时增加后端节点：
    # server 127.0.0.1:8001;
    # server 127.0.0.1:8002;
    keepalive 32;
}

server {
    listen 80;
    server_name yibao-zhinao.example.com;

    # HTTP → HTTPS 重定向（生产必开）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yibao-zhinao.example.com;

    # SSL 证书（生产替换为真实路径）
    ssl_certificate     /etc/nginx/ssl/yibao.pem;
    ssl_certificate_key /etc/nginx/ssl/yibao.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 上传文件大小限制（OCR 发票图片）
    client_max_body_size 12M;

    # 前端静态资源（Next.js 构建产物）
    root /var/www/yibao-zhinao;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理到后端
    # 数字人体 3D 查看器静态资源（GLB 模型较大，长缓存）
    location /digital-body/ {
        proxy_pass http://yibao_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    location /api/ {
        proxy_pass http://yibao_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # LLM 调用可能较慢，超时设长
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # OCR 上传走特殊超时
        location ~ ^/api/claims/ocr$ {
            proxy_pass http://yibao_backend;
            client_max_body_size 12M;
            proxy_read_timeout 120s;
        }
    }

    # 健康检查（不记日志）
    location /api/health {
        proxy_pass http://yibao_backend;
        access_log off;
    }

    # 限流：防恶意调用
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
    }
}
